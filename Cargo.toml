[package]
name = "portfolio_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
# tokio + native-tls
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres", "migrate", "chrono", "bigdecimal" ] }
# Add CORS support
tower-http = { version = "0.6.7", features = ["cors"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
rand = "0.9.2"
hex = "0.4.3"
chrono = {version = "0.4.42", features = ["serde"]}
argon2 = "0.5.3"
once_cell = "1.21.3"
dashmap = "6.1.0"
base64 = "0.22.1"
rust_decimal = "1.39.0"
smol = "2.0.2"
async-trait = "0.1.89"
reqwest = { version = "0.12.24", features = ["json"] }
tokio-cron-scheduler = "0.15.1"
serde_with = "3.16.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features=["json"] }

#[dev-dependencies]
#sqlx-cli = { version = "0.8.6", features = ["postgres"] }
