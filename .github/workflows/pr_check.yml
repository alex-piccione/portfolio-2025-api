   name: PR Check

   on:
     pull_request:
       branches: [main]

   # SQLX_OFFLINE: build uses the committed .sqlx cache, no DB needed in CI.
   # NOTE: after changing a query or a migration, re-run `cargo sqlx prepare`
   # locally and commit the refreshed .sqlx files, or CI will build against
   # stale schema metadata.
   env:
     SQLX_OFFLINE: "true"
     CARGO_TERM_COLOR: always

   jobs:
     build_and_test:
       name: 🧪 Build & Test
       runs-on: ubuntu-latest
       steps:
         - name: 📦 Checkout code
           uses: actions/checkout@v5

         - name: 🦀 Setup Rust toolchain
           uses: dtolnay/rust-toolchain@stable

         # Cache cargo registry + build artifacts: Rust deps are heavy,
         # this makes subsequent runs much faster.
         - name: 🗄️ Cache cargo registry and build artifacts
           uses: actions/cache@v4
           with:
             path: |
               ~/.cargo/registry
               ~/.cargo/git
               target
             key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
             restore-keys: ${{ runner.os }}-cargo-

         - name: ✅ Check
           run: cargo check --all-targets

         - name: 🔨 Build
           run: cargo build

         # No tests yet, but this will pick them up automatically
         # as soon as #[cfg(test)] modules or a tests/ folder exist.
         - name: 🧪 Test
           run: cargo test
