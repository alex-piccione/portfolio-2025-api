name: PR Check

on:
  pull_request:
    branches: [main]

# SQLX_OFFLINE: build uses the committed .sqlx cache, no DB needed in CI.
# NOTE: after changing a query or a migration, re-run `cargo sqlx prepare`
# locally and commit the refreshed .sqlx files, or CI will build against
# stale schema metadata.
env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v5

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache cargo registry + build artifacts: Rust deps are heavy,
      # this makes subsequent runs much faster.
      - name: 🗄️ Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # GitHub-hosted runners have Docker pre-installed and running,
      # so testcontainers can use it directly (no dind service needed).
      - name: 🐳 Verify Docker
        run: docker info

      - name: ✅ Check
        run: cargo check --all-targets

      - name: 🔨 Build
        run: cargo build

      # Unit tests (library): pure logic, no Docker required.
      - name: 🧪 Unit Tests
        run: cargo test --lib

      # Integration tests: spin up a real Postgres via testcontainers
      # (one container per test, hence --test-threads=1).
      - name: 🧪 Integration Tests
        run: cargo test --test integration_tests -- --test-threads=1
