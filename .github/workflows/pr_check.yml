name: PR Check

on:
  pull_request:
    branches: [main]

# SQLX_OFFLINE: build uses the committed .sqlx cache, no DB needed in CI.
# NOTE: after changing a query or a migration, re-run `cargo sqlx prepare`
# locally and commit the refreshed .sqlx files, or CI will build against
# stale schema metadata.
env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    services:
      # Docker-in-Docker service for integration tests (testcontainers)
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v5

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache cargo registry + build artifacts
      - name: 🗄️ Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Install Docker CLI so testcontainers can communicate with docker:dind
      - name: 🐳 Install Docker CLI
        run: |
          apt-get update && apt-get install -y docker.io
          echo "DOCKER_HOST=tcp://localhost:2375" >> $GITHUB_ENV

      - name: ✅ Check
        run: cargo check --all-targets

      - name: 🔨 Build
        run: cargo build

      # Unit tests only (no Docker required)
      - name: 🧪 Unit Tests
        run: cargo test --lib

      # Integration tests (requires Docker)
      - name: 🧪 Integration Tests
        run: cargo test --test integration_tests -- --test-threads=1